name: AerialTrack Pairwise Rescore
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aerialtrack-pairwise-rescore.yml'
      - 'aerialtrack_rescore/**'
permissions:
  actions: read
  contents: read
jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: 'torch==2.7.1' 'torchvision==0.22.1' 'numpy==2.0.2' 'pillow==11.3.0' 'opencv-python-headless==4.12.0.88' 'scipy==1.15.3' 'mcos-decoder==0.1.0'
      - name: Download exact five-way candidate
        uses: actions/download-artifact@v4
        with:
          name: aerialtrack-multiclass-candidate
          path: source-candidate
          github-token: ${{ github.token }}
          run-id: 30607821656
      - name: Download exact original held-out media
        uses: actions/download-artifact@v4
        with:
          name: aerialtrack-multiclass-heldout
          path: rescore/media
          github-token: ${{ github.token }}
          run-id: 30607821656
      - name: Rebuild exact CC0 validation media only
        run: |
          set -euxo pipefail
          test -f source-candidate/corpus.json
          test -f source-candidate/candidate/candidate_state.pt
          mkdir -p rescore/cache rescore/media rescore/out
          python aerialtrack_rescore/rebuild_from_manifest.py --manifest source-candidate/corpus.json --cache rescore/cache --out-root rescore/media --split validation --source drone_detection_thesis_cc0
      - name: Select pairwise score only on validation then run exact frozen held-out gate
        run: |
          python aerialtrack_rescore/pairwise_rescore.py --corpus source-candidate/corpus.json --data-root rescore/media --candidate-state source-candidate/candidate/candidate_state.pt --out-dir rescore/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aerialtrack-pairwise-candidate
          path: |
            source-candidate/corpus.json
            rescore/out/pairwise_candidate_state.pt
            rescore/out/selection_report.json
            rescore/out/final_test_benchmark.json
            rescore/out/final_test_predictions.json
          if-no-files-found: warn
          retention-days: 1
      - name: Preserve exact test media only when quality passes
        if: success()
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          c=json.load(open('source-candidate/corpus.json'));src=Path('rescore/media');dst=Path('rescore/heldout')
          for r in c['items']:
            if r['split']!='test':continue
            q=Path(r['path']);d=dst/q;d.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(src/q,d)
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aerialtrack-pairwise-heldout
          path: rescore/heldout
          retention-days: 1
