name: Implement embedded W3W
on:
  push:
    paths:
      - .github/workflows/implement-w3w-embedded.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply embedded W3W patch
        run: python scripts/_tmp_implement_w3w_embed.py
      - name: Validate Sky Finder
        run: python scripts/validate.py
      - name: Verify official W3W coordinate page without API
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          url='https://what3words.com/34.493382%2C-119.703552'
          ua='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'
          req=urllib.request.Request(url,headers={'User-Agent':ua})
          with urllib.request.urlopen(req,timeout=25) as r:
              headers={k.lower():v for k,v in r.headers.items()}
              body=r.read().decode('utf-8','ignore')
          assert 'x-frame-options' not in headers, headers.get('x-frame-options')
          assert 'frame-ancestors' not in headers.get('content-security-policy','').lower(), headers.get('content-security-policy')
          m=re.search(r'property="twitter:title" content="///([^\"]+)"',body)
          assert m, 'W3W page did not expose resolved 3-word address'
          assert m.group(1)=='opulence.diluting.corrosive', m.group(1)
          assert '34.493382' in body and '-119.703552' in body
          print('W3W no-API embedded coordinate resolution: PASS -> ///'+m.group(1))
          PY
      - name: Publish tested implementation and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/implement-w3w-embedded.yml .github/workflows/diagnose-w3w-embed.yml scripts/_tmp_implement_w3w_embed.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Embed what3words pilot map for one-tap mobile use'
          git push origin HEAD:main
