name: Fix Sky Finder marker contrast
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-marker-contrast.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patch rescue marker contrast
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old_css = ".pilotParaglider .pgCanopy{fill:#ff4a16;stroke:#fff;stroke-width:1.8}.pilotParaglider.stale .pgCanopy{fill:#8998aa}.pilotParaglider.warn .pgCanopy{fill:#f4b326}.pilotParaglider.help .pgCanopy{fill:#e5484d}"
          new_css = ".pilotParaglider .pgCanopy{fill:#ff6a16;stroke:#fff;stroke-width:1.8}.pilotParaglider.stale .pgCanopy{fill:#8998aa}.pilotParaglider.warn .pgCanopy{fill:#f4b326}.pilotParaglider.help .pgCanopy{fill:#d90429;stroke:#fff;stroke-width:2.2}.pilotParaglider.help .pgWrap{position:relative}.pilotParaglider.help .pgWrap:before{content:'';position:absolute;left:1px;top:1px;width:42px;height:42px;border:3px solid #d90429;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 0 7px rgba(217,4,41,.28)}"
          if old_css not in s:
              raise SystemExit('Expected marker CSS not found')
          s = s.replace(old_css, new_css, 1)

          old_legend = ".legendItem.help{--legend-color:#e5484d}.legendItem.recent{--legend-color:#ff6a16}"
          new_legend = ".legendItem.help{--legend-color:#d90429}.legendItem.recent{--legend-color:#ff6a16}"
          if old_legend not in s:
              raise SystemExit('Expected legend colors not found')
          s = s.replace(old_legend, new_legend, 1)

          old_help = '<div class="legendItem help"><svg class="legendPg"'
          new_help = '<div class="legendItem help" style="outline:3px solid #d90429;outline-offset:-4px"><svg class="legendPg"'
          if old_help not in s:
              raise SystemExit('Expected HELP legend item not found')
          s = s.replace(old_help, new_help, 1)
          p.write_text(s)

          sw = Path('sw.js')
          t = sw.read_text()
          if "sky-finder-v1.4.15" not in t:
              raise SystemExit('Expected cache version not found')
          sw.write_text(t.replace("sky-finder-v1.4.15", "sky-finder-v1.4.16", 1))

          validate = Path('scripts/validate.py')
          v = validate.read_text()
          if 'sky-finder-v1.4.15' in v:
              validate.write_text(v.replace('sky-finder-v1.4.15', 'sky-finder-v1.4.16'))

          assert '.pilotParaglider .pgCanopy{fill:#ff6a16' in s
          assert '.pilotParaglider.help .pgCanopy{fill:#d90429' in s
          assert '.pilotParaglider.help .pgWrap:before' in s
          assert '.legendItem.help{--legend-color:#d90429}' in s
          assert '.legendItem.recent{--legend-color:#ff6a16}' in s
          print('Marker contrast safety checks: PASS')
          PY
      - name: Run existing validation
        run: python scripts/validate.py
      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SkyFinderRescue"
          git config user.email "sky.bonillo@gmail.com"
          git rm .github/workflows/fix-marker-contrast.yml
          git add index.html sw.js scripts/validate.py
          git commit -m "Make HELP markers unmistakably red"
          git push origin main
