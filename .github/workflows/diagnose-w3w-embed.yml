name: Diagnose W3W embed
on:
  push:
    paths:
      - .github/workflows/diagnose-w3w-embed.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check W3W framing headers
        shell: bash
        run: |
          set -euo pipefail
          URL='https://map.what3words.com/34.493382%2C-119.703552'
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'
          echo '=== response chain ==='
          curl -A "$UA" -sSIL --max-time 20 "$URL" | sed -n '1,120p'
          echo '=== final response framing-related headers ==='
          curl -A "$UA" -sSL -D /tmp/headers -o /tmp/body --max-time 20 "$URL" || true
          grep -Ei '^(HTTP/|location:|x-frame-options:|content-security-policy:|cross-origin|permissions-policy:)' /tmp/headers || true
          echo '=== body size ==='
          wc -c /tmp/body || true
