name: Diagnose W3W embed
on:
  push:
    paths:
      - .github/workflows/diagnose-w3w-embed.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check W3W framing and coordinate resolution
        shell: bash
        run: |
          set -euo pipefail
          URL='https://map.what3words.com/34.493382%2C-119.703552'
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'
          curl -A "$UA" -sSL -D /tmp/headers -o /tmp/body --max-time 20 "$URL"
          echo '=== framing-related headers ==='
          grep -Ei '^(HTTP/|location:|x-frame-options:|content-security-policy:|cross-origin|permissions-policy:)' /tmp/headers || true
          echo '=== coordinate markers ==='
          grep -Eo '34\.493382|-119\.703552' /tmp/body | sort -u || true
          echo '=== likely 3-word addresses ==='
          python - <<'PY'
          import re
          text=open('/tmp/body',encoding='utf-8',errors='ignore').read()
          pats=[]
          for m in re.finditer(r'(?<![A-Za-z])(?:/{3})?([a-z][a-z-]{1,30}\.[a-z][a-z-]{1,30}\.[a-z][a-z-]{1,30})(?![A-Za-z])', text, re.I):
              w=m.group(1).lower()
              if w not in pats: pats.append(w)
          for w in pats[:80]: print(w)
          PY
          echo '=== nearby words fields ==='
          grep -Eo '.{0,100}(threewords|threeWords|words)[^<]{0,180}' /tmp/body | head -40 || true
