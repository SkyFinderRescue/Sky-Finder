name: XCFind feed probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public XCFind map resources
        run: |
          python - <<'PY'
          from __future__ import annotations
          import html
          import re
          import urllib.parse
          import urllib.request

          BASE = 'https://xcfind.paraglide.us/map.html?id=16'
          UA = {'User-Agent': 'SkyFinderRescue/1.0 (+public rescue app compatibility probe)'}

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=25) as r:
                  body = r.read().decode('utf-8', 'replace')
                  print(f'FETCH {url} -> {r.status} {r.geturl()} type={r.headers.get("content-type")} bytes={len(body)}')
                  return body, r.geturl()

          page, final = get(BASE)
          print('TITLE:', (re.search(r'<title[^>]*>(.*?)</title>', page, re.I|re.S) or [None,''])[1].strip())

          srcs = re.findall(r'<script[^>]+src=["\']([^"\']+)', page, re.I)
          hrefs = re.findall(r'<link[^>]+href=["\']([^"\']+)', page, re.I)
          print('SCRIPT_SRCS:', [urllib.parse.urljoin(final, html.unescape(x)) for x in srcs])
          print('LINK_HREFS:', [urllib.parse.urljoin(final, html.unescape(x)) for x in hrefs])

          interesting = re.compile(r'(?i)(?:https?://[^\s"\']+|[A-Za-z0-9_./?=&%-]+\.(?:php|json|xml|kml|kmz)(?:\?[^\s"\']*)?|pilotId|groupId|XMLHttpRequest|fetch\s*\(|ajax|latitude|longitude|lat\b|lng\b|track)')
          print('--- INLINE INTERESTING LINES ---')
          for i, line in enumerate(page.splitlines(), 1):
              if interesting.search(line):
                  cleaned = re.sub(r'\s+', ' ', line).strip()
                  if len(cleaned) > 700: cleaned = cleaned[:700] + '…'
                  print(f'HTML {i}: {cleaned}')

          print('--- SCRIPT INTERESTING LINES ---')
          for src in srcs:
              url = urllib.parse.urljoin(final, html.unescape(src))
              if urllib.parse.urlparse(url).netloc != urllib.parse.urlparse(final).netloc:
                  continue
              try:
                  js, _ = get(url)
              except Exception as exc:
                  print('SCRIPT_FETCH_ERROR', url, repr(exc))
                  continue
              hits = 0
              for i, line in enumerate(js.splitlines(), 1):
                  if interesting.search(line):
                      cleaned = re.sub(r'\s+', ' ', line).strip()
                      if len(cleaned) > 900: cleaned = cleaned[:900] + '…'
                      print(f'JS {url} {i}: {cleaned}')
                      hits += 1
                      if hits >= 120:
                          print('...hit limit reached for script...')
                          break
          PY
