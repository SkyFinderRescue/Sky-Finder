name: XCFind feed probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect XCFind latest-position schema
        run: |
          python - <<'PY'
          from __future__ import annotations
          import collections
          import json
          import time
          import urllib.request

          def fetch(url, origin='https://skyfinderrescue.github.io'):
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'SkyFinderRescue/1.0 (+public rescue app compatibility probe)',
                  'Origin': origin,
              })
              with urllib.request.urlopen(req, timeout=25) as r:
                  body = r.read().decode('utf-8', 'replace')
                  print('FETCH', url, 'status=', r.status, 'bytes=', len(body),
                        'acao=', repr(r.headers.get('access-control-allow-origin')),
                        'cache=', repr(r.headers.get('cache-control')))
                  return body

          data = json.loads(fetch('https://xcfind.paraglide.us/getmessagesjson.php?groupId=16&dateRange=1'))
          devices = data.get('devices', [])
          latest = []
          for d in devices:
              msgs = d.get('Messages') or []
              if msgs:
                  latest.append(msgs[-1])

          print('DEVICE_COUNT', len(devices), 'WITH_MESSAGES', len(latest))
          if latest:
              print('LATEST_KEYS', sorted(latest[0].keys()))
              print('LATEST_TYPES', {k:type(v).__name__ for k,v in latest[0].items()})
              now = time.time()
              ages = []
              valid_coords = 0
              types = collections.Counter()
              for m in latest:
                  try:
                      ages.append(max(0, now - float(m['Timestamp'])))
                  except Exception:
                      pass
                  try:
                      lat = float(m['Lat']); lng = float(m['Lng'])
                      if -90 <= lat <= 90 and -180 <= lng <= 180:
                          valid_coords += 1
                  except Exception:
                      pass
                  types[str(m.get('Type'))] += 1
              print('VALID_LATEST_COORDS', valid_coords)
              print('LATEST_TYPE_COUNTS', dict(types))
              if ages:
                  print('AGE_SECONDS_MIN_MAX', round(min(ages)), round(max(ages)))

          fetch('https://raw.githubusercontent.com/SkyFinderRescue/Sky-Finder/main/index.html')
          PY
