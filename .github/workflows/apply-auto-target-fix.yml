name: Apply Sky Finder auto-target fix

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip if already applied
        id: check
        run: |
          if ! grep -q "Use Last Point" index.html && grep -q "sky-finder-v1.4.2" sw.js; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply focused update and verify
        if: steps.check.outputs.done != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace(".pilotActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}", ".pilotActions{display:grid;grid-template-columns:1fr;gap:7px;margin-top:9px}")
          s = s.replace("let myPosition=null,targetPosition=null,pilotSnapshot=null,watchId=null,snapshotTimer=null,map=null,myMarker=null,hasAutoCenteredOnGps=false,pendingMyArea=false;const selectedPilotIds=new Set(),markerByPilotId=new Map();", "let myPosition=null,targetPosition=null,pilotSnapshot=null,watchId=null,snapshotTimer=null,map=null,myMarker=null,hasAutoCenteredOnGps=false,pendingMyArea=false,activePilotId=null;const selectedPilotIds=new Set(),markerByPilotId=new Map();")
          old = "function setPilotAsTarget(id){const p=allPilots().find(x=>pilotId(x)===id);if(!p)return;const lat=Number(p.lat),lng=Number(p.lng);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;els.targetCoords.value=`${fmt(lat)}, ${fmt(lng)}`;updateTarget();els.targetStatus.textContent=`${p.name||'Pilot'}: ${coordText({lat,lng})}`;}"
          new = "function setPilotAsTarget(id){const p=allPilots().find(x=>pilotId(x)===id);if(!p)return;const lat=Number(p.lat),lng=Number(p.lng);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;activePilotId=id;els.targetCoords.value=`${fmt(lat)}, ${fmt(lng)}`;updateTarget();els.targetStatus.textContent=`${p.name||'Pilot'}: ${coordText({lat,lng})}`;}"
          if old not in s: raise SystemExit('setPilotAsTarget pattern missing')
          s = s.replace(old,new)
          old = "<div class=\"pilotActions\"><button class=\"btn primary usePilotBtn\" type=\"button\" data-pilot-id=\"${escapeHtml(id)}\" data-lat=\"${Number(p.lat)}\" data-lng=\"${Number(p.lng)}\" data-name=\"${escapeHtml(p.name||'Pilot')}\">Use Last Point</button><a class=\"btn verifyPilotBtn\" href=\"${pilotDetailUrl(p)}\" target=\"_blank\" rel=\"noopener noreferrer\">Verify XCFind</a></div>"
          new = "<div class=\"pilotActions\"><a class=\"btn verifyPilotBtn\" href=\"${pilotDetailUrl(p)}\" target=\"_blank\" rel=\"noopener noreferrer\">Verify XCFind</a></div>"
          if old not in s: raise SystemExit('button pattern missing')
          s = s.replace(old,new)
          old = "const validIds=new Set(allPilots().map(pilotId));[...selectedPilotIds].forEach(id=>{if(!validIds.has(id))selectedPilotIds.delete(id)});syncMapMarkers();renderSelectionState()"
          new = "const validIds=new Set(allPilots().map(pilotId));[...selectedPilotIds].forEach(id=>{if(!validIds.has(id))selectedPilotIds.delete(id)});if(activePilotId&&validIds.has(activePilotId))setPilotAsTarget(activePilotId);else if(activePilotId&&!validIds.has(activePilotId))activePilotId=null;syncMapMarkers();renderSelectionState()"
          if old not in s: raise SystemExit('refresh pattern missing')
          s = s.replace(old,new)
          old = "els.pilotList.addEventListener('click',e=>{const use=e.target.closest?e.target.closest('.usePilotBtn'):null;if(use){const lat=Number(use.dataset.lat),lng=Number(use.dataset.lng);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;els.targetCoords.value=`${fmt(lat)}, ${fmt(lng)}`;updateTarget();els.targetStatus.textContent=`${use.dataset.name||'Pilot'}: ${coordText({lat,lng})}`;return}const focus=e.target.closest?e.target.closest('.focusPilotBtn'):null;"
          new = "els.pilotList.addEventListener('click',e=>{const focus=e.target.closest?e.target.closest('.focusPilotBtn'):null;"
          if old not in s: raise SystemExit('click handler pattern missing')
          s = s.replace(old,new)
          if 'Use Last Point' in s or 'usePilotBtn' in s: raise SystemExit('obsolete control still present')
          p.write_text(s)
          sw = Path('sw.js')
          t = sw.read_text().replace("sky-finder-v1.4.1", "sky-finder-v1.4.2")
          if "sky-finder-v1.4.2" not in t: raise SystemExit('cache bump failed')
          sw.write_text(t)
          PY
          git diff --check
          ! grep -q "Use Last Point" index.html
          grep -q "activePilotId" index.html
          grep -q "sky-finder-v1.4.2" sw.js
      - name: Commit update
        if: steps.check.outputs.done != 'true'
        run: |
          git config user.name "SkyFinderRescue"
          git config user.email "sky.bonillo@gmail.com"
          git add index.html sw.js
          git commit -m "Automatically target selected pilot latest position"
          git push
