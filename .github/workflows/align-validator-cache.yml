name: Align Sky Finder validator cache
on:
  push:
    paths:
      - .github/workflows/align-validator-cache.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update expected cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate.py')
          h=p.read_text()
          old='assert "sky-finder-v1.4.13" in sw'
          new='assert "sky-finder-v1.4.14" in sw'
          assert old in h, 'old cache validator expectation not found'
          h=h.replace(old,new,1)
          p.write_text(h)
          PY
      - name: Validate
        run: python scripts/validate.py
      - name: Publish and clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/align-validator-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align validator with refreshed logo cache'
          git push origin HEAD:main
