name: Enable one-tap what3words

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-one-tap-w3w.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace copy-paste W3W with coordinate deep link
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_button = '<button id="w3wTarget" class="btn" type="button" disabled title="Copy the selected pilot coordinates for what3words Search">Copy for W3W</button>'
          new_button = '<a id="w3wTarget" class="btn" href="#" target="_blank" rel="noopener noreferrer" aria-disabled="true" title="Open selected pilot coordinates directly in what3words">W3W</a>'
          assert old_button in s, 'Current safe W3W button marker not found'
          s = s.replace(old_button, new_button, 1)

          old_links = "function setTargetLinks(p){const q=`${p.lat},${p.lng}`,links={apple:`https://maps.apple.com/?daddr=${encodeURIComponent(q)}&dirflg=d`,google:`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}`};[[els.appleTarget,links.apple],[els.googleTarget,links.google]].forEach(([a,href])=>{a.href=href;a.removeAttribute('aria-disabled')});els.w3wTarget.disabled=false;els.copyTargetBtn.disabled=false} function clearTargetLinks(){[els.appleTarget,els.googleTarget].forEach(a=>{a.href='#';a.setAttribute('aria-disabled','true')});els.w3wTarget.disabled=true;els.copyTargetBtn.disabled=true}"
          new_links = "function setTargetLinks(p){const q=`${p.lat},${p.lng}`,links={apple:`https://maps.apple.com/?daddr=${encodeURIComponent(q)}&dirflg=d`,google:`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}`,w3w:`https://map.what3words.com/${encodeURIComponent(q)}`};[[els.appleTarget,links.apple],[els.googleTarget,links.google],[els.w3wTarget,links.w3w]].forEach(([a,href])=>{a.href=href;a.removeAttribute('aria-disabled')});els.copyTargetBtn.disabled=false} function clearTargetLinks(){[els.appleTarget,els.googleTarget,els.w3wTarget].forEach(a=>{a.href='#';a.setAttribute('aria-disabled','true')});els.copyTargetBtn.disabled=true}"
          assert old_links in s, 'Current W3W target-link function marker not found'
          s = s.replace(old_links, new_links, 1)

          old_click = "els.w3wTarget.addEventListener('click',async()=>{if(!targetPosition)return;const coords=coordText(targetPosition),old=els.w3wTarget.textContent;els.w3wTarget.textContent=await copyText(coords,'Copied');els.targetStatus.textContent=`what3words: copied ${coords}. Open what3words and paste into Search.`;setTimeout(()=>els.w3wTarget.textContent=old,1400)});"
          assert old_click in s, 'Current W3W copy handler marker not found'
          s = s.replace(old_click, '', 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          sws = sw.read_text(encoding='utf-8')
          sws2 = re.sub(r'sky-finder-v1\.4\.\d+', 'sky-finder-v1.4.5', sws, count=1)
          assert sws2 != sws, 'Service-worker cache version marker not found'
          sw.write_text(sws2, encoding='utf-8')

          v = Path('scripts/validate.py')
          vs = v.read_text(encoding='utf-8')
          vs = vs.replace('    "Copy for W3W",\n', '    "W3W",\n', 1)
          vs = vs.replace('    "Open what3words and paste into Search.",\n', '    "https://map.what3words.com/${encodeURIComponent(q)}",\n', 1)
          vs = re.sub(r'sky-finder-v1\.4\.\d+', 'sky-finder-v1.4.5', vs)
          vs = vs.replace('assert "https://map.what3words.com/" not in html, "Unsafe generic what3words launcher remains"\n', '')
          anchor = 'assert "https://what3words.com/?map=" not in html, "Unsafe legacy what3words coordinate URL is still present"\n'
          assert anchor in vs, 'W3W safety assertion anchor missing'
          extra = (
              'assert "https://map.what3words.com/${encodeURIComponent(q)}" in html, "One-tap W3W coordinate deep link missing"\n'
              'assert "Open what3words and paste into Search." not in html, "Obsolete W3W copy/paste flow remains"\n'
              'assert "Copy for W3W" not in html, "Obsolete W3W copy button remains"\n'
          )
          if 'One-tap W3W coordinate deep link missing' not in vs:
              vs = vs.replace(anchor, anchor + extra, 1)
          v.write_text(vs, encoding='utf-8')
          PY

          python scripts/validate.py

      - name: Publish tested one-tap W3W and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/enable-one-tap-w3w.yml
          git add index.html sw.js scripts/validate.py
          git commit -m 'Enable one-tap what3words pilot handoff'
          git push origin HEAD:main
