name: Apply what3words target fix

on:
  push:
    branches: [agent/fix-what3words-target]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-what3words-target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply target and what3words fix
        run: python scripts/apply_w3w_target_fix.py
      - name: Validate app
        run: python scripts/validate.py
      - name: Commit generated fix
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js scripts/validate.py
          git commit -m "Fix pilot target and what3words handoff"
          git push origin HEAD:agent/fix-what3words-target
