name: Verify deployed area map

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Sky Finder and live snapshot
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          PAGE='https://skyfinderrescue.github.io/Sky-Finder/'
          SW='https://skyfinderrescue.github.io/Sky-Finder/sw.js'
          DATA='https://raw.githubusercontent.com/SkyFinderRescue/Sky-Finder/data-live/latest.json'
          UA={'User-Agent':'SkyFinderRescue deployment verifier'}

          def get(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=25) as r:
                  return r.status,r.read().decode('utf-8','replace')

          required=[
              'Recent Pilot Area Map',
              'Pilots in map view',
              'mapPilotList',
              'selectedPilotIds',
              'visiblePilots',
              'other names hidden',
              'Open XCFind Tracks',
              'leaflet@1.9.4',
          ]

          last=''
          for attempt in range(24):
              try:
                  status,html=get(PAGE+f'?deploy_check={int(time.time())}')
                  missing=[x for x in required if x not in html]
                  if status==200 and not missing:
                      print('PUBLIC_PAGE_PASS bytes=',len(html))
                      break
                  last=f'status={status} missing={missing}'
              except Exception as exc:
                  last=repr(exc)
              print('Waiting for Pages deployment:',last)
              time.sleep(10)
          else:
              raise AssertionError('Public page did not deploy expected build: '+last)

          status,sw=get(SW+f'?deploy_check={int(time.time())}')
          assert status==200 and 'sky-finder-v1.2.0' in sw, 'Service worker is not v1.2.0'
          print('SERVICE_WORKER_PASS')

          status,raw=get(DATA+f'?deploy_check={int(time.time())}')
          data=json.loads(raw)
          assert status==200
          assert data.get('schema_version')==1
          assert isinstance(data.get('pilots'),list) and data['pilots']
          assert all('lat' in p and 'lng' in p and 'timestamp' in p for p in data['pilots'])
          print('LIVE_SNAPSHOT_PASS pilots=',len(data['pilots']))
          PY
