name: Fix what3words handoff safety

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-w3w-safety.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace unsafe W3W launch with exact-coordinate copy
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_button = '<a id="w3wTarget" class="btn" href="#" target="_blank" rel="noopener noreferrer" aria-disabled="true">W3W Search</a>'
          new_button = '<button id="w3wTarget" class="btn" type="button" disabled title="Copy the selected pilot coordinates for what3words Search">Copy for W3W</button>'
          assert old_button in s, 'W3W control marker not found'
          s = s.replace(old_button, new_button, 1)

          old_links = "function setTargetLinks(p){const q=`${p.lat},${p.lng}`,links={apple:`https://maps.apple.com/?daddr=${encodeURIComponent(q)}&dirflg=d`,google:`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}`,w3w:'https://map.what3words.com/'};[[els.appleTarget,links.apple],[els.googleTarget,links.google],[els.w3wTarget,links.w3w]].forEach(([a,href])=>{a.href=href;a.removeAttribute('aria-disabled')});els.copyTargetBtn.disabled=false} function clearTargetLinks(){[els.appleTarget,els.googleTarget,els.w3wTarget].forEach(a=>{a.href='#';a.setAttribute('aria-disabled','true')});els.copyTargetBtn.disabled=true}"
          new_links = "function setTargetLinks(p){const q=`${p.lat},${p.lng}`,links={apple:`https://maps.apple.com/?daddr=${encodeURIComponent(q)}&dirflg=d`,google:`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}`};[[els.appleTarget,links.apple],[els.googleTarget,links.google]].forEach(([a,href])=>{a.href=href;a.removeAttribute('aria-disabled')});els.w3wTarget.disabled=false;els.copyTargetBtn.disabled=false} function clearTargetLinks(){[els.appleTarget,els.googleTarget].forEach(a=>{a.href='#';a.setAttribute('aria-disabled','true')});els.w3wTarget.disabled=true;els.copyTargetBtn.disabled=true}"
          assert old_links in s, 'W3W link function marker not found'
          s = s.replace(old_links, new_links, 1)

          old_click = "els.w3wTarget.addEventListener('click',e=>{if(!targetPosition){e.preventDefault();return}const coords=coordText(targetPosition);void copyText(coords,'Copied for what3words');els.targetStatus.textContent=`what3words: copied ${coords}. Paste into Search.`;});"
          new_click = "els.w3wTarget.addEventListener('click',async()=>{if(!targetPosition)return;const coords=coordText(targetPosition),old=els.w3wTarget.textContent;els.w3wTarget.textContent=await copyText(coords,'Copied');els.targetStatus.textContent=`what3words: copied ${coords}. Open what3words and paste into Search.`;setTimeout(()=>els.w3wTarget.textContent=old,1400)});"
          assert old_click in s, 'W3W click-handler marker not found'
          s = s.replace(old_click, new_click, 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          sws = sw.read_text(encoding='utf-8')
          assert "sky-finder-v1.4.3" in sws, 'Unexpected service-worker cache version'
          sw.write_text(sws.replace('sky-finder-v1.4.3','sky-finder-v1.4.4',1), encoding='utf-8')

          v = Path('scripts/validate.py')
          vs = v.read_text(encoding='utf-8')
          assert '"https://map.what3words.com/",' in vs
          assert '"Copied for what3words",' in vs
          vs = vs.replace('"https://map.what3words.com/",', '"Copy for W3W",', 1)
          vs = vs.replace('"Copied for what3words",', '"Open what3words and paste into Search.",', 1)
          # The current UI auto-targets on pilot selection; the old Use Last Point button was intentionally removed.
          vs = vs.replace('    "Use Last Point",\n', '')
          vs = vs.replace('sky-finder-v1.4.3', 'sky-finder-v1.4.4')
          safety = 'assert "https://map.what3words.com/" not in html, "Unsafe generic what3words launcher remains"\n'
          anchor = 'assert "https://what3words.com/?map=" not in html, "Unsafe legacy what3words coordinate URL is still present"\n'
          assert anchor in vs
          if safety not in vs:
              vs = vs.replace(anchor, anchor + safety, 1)
          v.write_text(vs, encoding='utf-8')
          PY

          python scripts/validate.py

      - name: Publish tested fix and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-w3w-safety.yml
          git add index.html sw.js scripts/validate.py
          git commit -m 'Make what3words handoff fail-safe'
          git push origin HEAD:main
