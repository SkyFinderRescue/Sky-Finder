name: Polish final Sky Finder UI
on:
  push:
    paths:
      - .github/workflows/polish-final-ui.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final UI-only polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text()
          old='.mapSelection{background:rgba(7,25,46,.92);border:0;border-radius:11px;color:#fff}'
          new='.mapSelection{left:60px;top:10px;max-width:calc(100% - 72px);background:rgba(7,25,46,.92);border:0;border-radius:11px;color:#fff}'
          assert old in h, 'map selection style not found'
          h=h.replace(old,new,1)
          h=h.replace('<span>Verify pilot + timestamp in XCFind.</span>','',1)
          p.write_text(h)
          PY
      - name: Validate unchanged rescue behavior
        run: python scripts/validate.py
      - name: Publish and clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/polish-final-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish final Sky Finder mobile UI'
          git push origin HEAD:main
