name: Run Sky Finder status legend patch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-status-legend.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved legend
        run: python scripts/apply_status_legend.py
      - name: Validate
        run: python scripts/validate.py
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SkyFinderRescue"
          git config user.email "sky.bonillo@gmail.com"
          git rm .github/workflows/run-status-legend.yml .github/workflows/add-status-legend.yml scripts/apply_status_legend.py
          git add index.html sw.js scripts/validate.py scripts/ui_e2e.mjs
          git commit -m "Add firefighter pilot status legend"
          git push origin main
