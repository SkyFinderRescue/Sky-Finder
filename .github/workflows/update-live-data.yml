name: Update Sky Finder live data

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/build_live_snapshot.py'
      - 'scripts/test_live_snapshot.py'
      - '.github/workflows/update-live-data.yml'
  workflow_dispatch:
  schedule:
    # Offset from the top of the hour to reduce scheduler congestion.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

permissions:
  contents: write

concurrency:
  group: skyfinder-live-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test snapshot transformer
        run: python scripts/test_live_snapshot.py
      - name: Fetch live XCFind snapshot
        run: python scripts/build_live_snapshot.py /tmp/latest.json
      - name: Validate generated snapshot
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          p = Path('/tmp/latest.json')
          data = json.loads(p.read_text())
          assert data['schema_version'] == 1
          assert data['source'] == 'XCFind'
          assert data['pilot_count'] == len(data['pilots'])
          assert data['pilot_count'] > 0
          assert abs(time.time() - int(data['fetched_at_epoch'])) < 300
          required = {'name','pilot_id','timestamp','lat','lng','type','alt_ft'}
          for pilot in data['pilots']:
              assert set(pilot) == required
              assert -90 <= float(pilot['lat']) <= 90
              assert -180 <= float(pilot['lng']) <= 180
          print(f"Generated live snapshot validated: {data['pilot_count']} pilots")
          PY
      - name: Publish current snapshot
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cp /tmp/latest.json /tmp/latest-publish.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan live-data-next
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/latest-publish.json latest.json
          cat > README.md <<'EOF'
          # Sky Finder live-data snapshot

          Automatically generated from XCFind's public California group feed.
          This branch contains only the latest point needed for Sky Finder quick search; XCFind remains the authoritative live source.
          EOF
          git add latest.json README.md
          git commit -m 'Update XCFind live snapshot'
          git push --force origin HEAD:data-live
