name: Fix mobile what3words navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-w3w-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use native coordinate format for mobile what3words handoff
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "w3w:`https://map.what3words.com/${encodeURIComponent(q)}`"
          new = "w3w:`https://map.what3words.com/${p.lat},${p.lng}`"
          assert old in s, 'Encoded W3W coordinate link not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          sws = sw.read_text(encoding='utf-8')
          assert "sky-finder-v1.4.6" in sws, 'Unexpected service-worker version'
          sw.write_text(sws.replace('sky-finder-v1.4.6','sky-finder-v1.4.7',1), encoding='utf-8')

          v = Path('scripts/validate.py')
          vs = v.read_text(encoding='utf-8')
          vs = vs.replace('https://map.what3words.com/${encodeURIComponent(q)}', 'https://map.what3words.com/${p.lat},${p.lng}')
          vs = vs.replace('sky-finder-v1.4.6', 'sky-finder-v1.4.7')
          anchor = 'assert "https://what3words.com/?map=" not in html, "Unsafe legacy what3words coordinate URL is still present"\n'
          extra = 'assert "map.what3words.com/${encodeURIComponent(q)}" not in html, "Encoded W3W coordinate handoff remains"\n'
          if extra not in vs:
              assert anchor in vs
              vs = vs.replace(anchor, anchor + extra, 1)
          v.write_text(vs, encoding='utf-8')
          PY

          python scripts/validate.py

      - name: Publish tested mobile fix and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-mobile-w3w-navigation.yml
          git add index.html sw.js scripts/validate.py
          git commit -m 'Fix mobile what3words pilot handoff'
          git push origin HEAD:main
