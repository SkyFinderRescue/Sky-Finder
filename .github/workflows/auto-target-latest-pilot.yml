name: Apply latest-pilot auto-target update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-target-latest-pilot.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused Sky Finder update
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          original = text

          old_card = '''<div class="pilotActions"><button class="btn primary usePilotBtn" type="button" data-pilot-id="${escapeHtml(id)}" data-lat="${Number(p.lat)}" data-lng="${Number(p.lng)}" data-name="${escapeHtml(p.name||'Pilot')}">Use Last Point</button><a class="btn verifyPilotBtn" href="${pilotDetailUrl(p)}" target="_blank" rel="noopener noreferrer">Verify XCFind</a></div>'''
          new_card = '''<div class="pilotActions"><a class="btn verifyPilotBtn" href="${pilotDetailUrl(p)}" target="_blank" rel="noopener noreferrer">Verify XCFind</a></div>'''
          if old_card not in text:
              raise SystemExit('Expected Use Last Point card markup was not found')
          text = text.replace(old_card, new_card, 1)

          old_css = '.pilotActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}'
          new_css = '.pilotActions{display:grid;grid-template-columns:1fr;gap:7px;margin-top:9px}'
          if old_css not in text:
              raise SystemExit('Expected pilotActions CSS was not found')
          text = text.replace(old_css, new_css, 1)

          old_mobile_css = '@media(max-width:470px){.pilotActions{grid-template-columns:1fr 1fr}.targetLinks{grid-template-columns:1fr 1fr}}'
          new_mobile_css = '@media(max-width:470px){.pilotActions{grid-template-columns:1fr}.targetLinks{grid-template-columns:1fr 1fr}}'
          if old_mobile_css not in text:
              raise SystemExit('Expected mobile pilotActions CSS was not found')
          text = text.replace(old_mobile_css, new_mobile_css, 1)

          old_refresh = '''const validIds=new Set(allPilots().map(pilotId));[...selectedPilotIds].forEach(id=>{if(!validIds.has(id))selectedPilotIds.delete(id)});syncMapMarkers();renderSelectionState()'''
          new_refresh = '''const validIds=new Set(allPilots().map(pilotId));[...selectedPilotIds].forEach(id=>{if(!validIds.has(id))selectedPilotIds.delete(id)});const activeTargetId=[...selectedPilotIds].at(-1);if(activeTargetId)setPilotAsTarget(activeTargetId);syncMapMarkers();renderSelectionState()'''
          if old_refresh not in text:
              raise SystemExit('Expected snapshot refresh selection logic was not found')
          text = text.replace(old_refresh, new_refresh, 1)

          old_click = '''els.pilotList.addEventListener('click',e=>{const use=e.target.closest?e.target.closest('.usePilotBtn'):null;if(use){const lat=Number(use.dataset.lat),lng=Number(use.dataset.lng);if(!Number.isFinite(lat)||!Number.isFinite(lng))return;els.targetCoords.value=`${fmt(lat)}, ${fmt(lng)}`;updateTarget();els.targetStatus.textContent=`${use.dataset.name||'Pilot'}: ${coordText({lat,lng})}`;return}const focus=e.target.closest?e.target.closest('.focusPilotBtn'):null;'''
          new_click = '''els.pilotList.addEventListener('click',e=>{const focus=e.target.closest?e.target.closest('.focusPilotBtn'):null;'''
          if old_click not in text:
              raise SystemExit('Expected Use Last Point click handler was not found')
          text = text.replace(old_click, new_click, 1)

          if text == original:
              raise SystemExit('No index.html changes were made')
          path.write_text(text)

          sw = Path('sw.js')
          sw_text = sw.read_text()
          if "const CACHE = 'sky-finder-v1.4.1';" not in sw_text:
              raise SystemExit('Expected service-worker cache version was not found')
          sw.write_text(sw_text.replace("const CACHE = 'sky-finder-v1.4.1';", "const CACHE = 'sky-finder-v1.4.2';", 1))

          workflow = Path('.github/workflows/auto-target-latest-pilot.yml')
          workflow.unlink()
          PY
      - name: Verify focused behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text()
          assert 'Use Last Point' not in text
          assert 'usePilotBtn' not in text
          assert 'const activeTargetId=[...selectedPilotIds].at(-1);if(activeTargetId)setPilotAsTarget(activeTargetId);' in text
          assert "function selectOnlyPilot(id,center=true){selectedPilotIds.clear();if(id){selectedPilotIds.add(id);setPilotAsTarget(id)}" in text
          assert "if(box.checked){selectedPilotIds.add(box.dataset.pilotId);setPilotAsTarget(box.dataset.pilotId)}" in text
          assert "const CACHE = 'sky-finder-v1.4.2';" in Path('sw.js').read_text()
          print('Focused latest-pilot auto-target checks passed')
          PY
      - name: Commit production update
        run: |
          git config user.name 'Sky Finder Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js .github/workflows/auto-target-latest-pilot.yml
          git commit -m 'Auto-target selected pilot latest location'
          git push
