name: Verify compact mobile deployment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed compact Sky Finder
        run: |
          python - <<'PY'
          import time
          import urllib.request

          PAGE='https://skyfinderrescue.github.io/Sky-Finder/'
          SW='https://skyfinderrescue.github.io/Sky-Finder/sw.js'
          UA={'User-Agent':'SkyFinderRescue compact mobile deployment verifier'}

          def get(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=25) as r:
                  return r.status,r.read().decode('utf-8','replace')

          required=[
              'Pilot Area Map',
              'Paraglider rescue locator',
              'gpsActions',
              'height:49vh',
              'grid-template-columns:1fr 1fr',
              'Questions/Suggestions',
              'mailto:Sky.Bonillo@gmail.com',
              'Verify pilot + timestamp in XCFind.',
          ]
          last=''
          for attempt in range(24):
              try:
                  status,html=get(PAGE+f'?compact_check={int(time.time())}')
                  missing=[x for x in required if x not in html]
                  if status==200 and not missing:
                      print('PUBLIC_COMPACT_PAGE_PASS bytes=',len(html))
                      break
                  last=f'status={status} missing={missing}'
              except Exception as exc:
                  last=repr(exc)
              print('Waiting for Pages deployment:',last)
              time.sleep(10)
          else:
              raise AssertionError('Public compact page did not deploy: '+last)

          status,sw=get(SW+f'?compact_check={int(time.time())}')
          assert status==200 and 'sky-finder-v1.3.0' in sw, 'Service worker is not v1.3.0'
          print('SERVICE_WORKER_V13_PASS')
          PY
