name: Diagnose what3words coordinate resolution

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose-w3w-coordinate-resolution.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test coordinate URLs
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://what3words.com/34.493382,-119.703552' \
            'https://map.what3words.com/34.493382,-119.703552' \
            'https://what3words.com/?map=34.493382%2C-119.703552%2C17'
          do
            echo "===== $url ====="
            echo '-- headers --'
            curl -sSIL --max-time 20 "$url" | sed -n '1,40p'
            echo '-- final URL --'
            curl -sSL -o /tmp/w3w.html -w '%{url_effective}\n' --max-time 20 "$url"
            echo '-- candidate 3-word strings --'
            grep -Eo '///[A-Za-z-]+\.[A-Za-z-]+\.[A-Za-z-]+|[A-Za-z-]+\.[A-Za-z-]+\.[A-Za-z-]+' /tmp/w3w.html | head -30 || true
            echo '-- body markers --'
            grep -Eio 'threewords|three word|words|coordinates|34\.493382|-119\.703552' /tmp/w3w.html | head -30 || true
          done
