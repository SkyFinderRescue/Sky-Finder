name: Verify deployed what3words target fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public Sky Finder target handoff
        run: |
          python - <<'PY'
          import time
          import urllib.request

          PAGE='https://skyfinderrescue.github.io/Sky-Finder/'
          SW='https://skyfinderrescue.github.io/Sky-Finder/sw.js'
          UA={'User-Agent':'SkyFinderRescue what3words deployment verifier'}

          def get(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=25) as r:
                  return r.status,r.read().decode('utf-8','replace')

          required=[
              'setPilotAsTarget',
              'W3W Search',
              'https://map.what3words.com/',
              'Copied for what3words',
              '.btn[aria-disabled="true"]',
          ]
          last=''
          for _ in range(24):
              try:
                  status,html=get(PAGE+f'?w3w_deploy={int(time.time())}')
                  missing=[x for x in required if x not in html]
                  bad='https://what3words.com/?map=' in html
                  if status==200 and not missing and not bad:
                      print('PUBLIC_W3W_FIX_PASS bytes=',len(html))
                      break
                  last=f'status={status} missing={missing} legacy_url={bad}'
              except Exception as exc:
                  last=repr(exc)
              print('Waiting for Pages deployment:',last)
              time.sleep(10)
          else:
              raise AssertionError('Public page did not deploy W3W fix: '+last)

          status,sw=get(SW+f'?w3w_deploy={int(time.time())}')
          assert status==200 and 'sky-finder-v1.4.0' in sw, 'Service worker is not v1.4.0'
          print('SERVICE_WORKER_V14_PASS')
          PY
