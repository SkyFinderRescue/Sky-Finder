name: AerialTrack Temporary Compute Probe
on:
  push:
    branches: [aerialtrack-compute-20260730]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/aerialtrack-compute-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Prove public standard runner execution
        run: |
          set -euxo pipefail
          uname -a
          python3 --version
          echo AERIALTRACK_PUBLIC_COMPUTE_PROBE_OK
